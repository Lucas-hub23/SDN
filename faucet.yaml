meters:
  guest-ratelimit:
    meter_id: 1
    entry:
      flags: ["KBPS", "BURST", "STATS"]
      bands:
        - type: DROP
          rate: 10000        # 10 Mbit/s
          burst_size: 1000   # 1000 kb burst

acls:
  # ---------------------------------------------------------------
  # Gastnetwerk gebouw A.
  #
  # Scheiding met employee/management komt van de routers: guest_a
  # zit alleen met wan_a in een router, dus er BESTAAT geen pad naar
  # de andere VLAN's. Deze ACL doet twee dingen die de routers niet
  # kunnen: gast-naar-gast blokkeren BINNEN hetzelfde subnet (dat is
  # L2-verkeer, daar komt geen routing aan te pas) en rate limiting.
  # ---------------------------------------------------------------
  guest-a-isolation:
    # ARP moet door, anders vindt een gast zijn gateway niet
    - rule: {dl_type: 0x0806, actions: {allow: true}}

    # ICMPv6 Neighbor Discovery: de IPv6-tegenhanger van ARP
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 133, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 134, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 135, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 136, actions: {allow: true}}

    # Eigen gateway bereikbaar - MOET voor de deny-regels staan
    - rule: {dl_type: 0x0800, nw_dst: "10.20.0.1", actions: {allow: true}}
    - rule: {dl_type: 0x86dd, ipv6_dst: "2001:db8:a:20::1", actions: {allow: true}}

    # Gast-naar-gast binnen het eigen subnet: dicht, beide protocollen
    - rule: {dl_type: 0x0800, nw_dst: "10.20.0.0/24", actions: {allow: false}}
    - rule: {dl_type: 0x86dd, ipv6_dst: "2001:db8:a:20::/64", actions: {allow: false}}

    # Al het overige (internet) door de meter
    - rule:
        actions:
          allow: true
          meter: guest-ratelimit

  # Gastnetwerk gebouw B - zelfde opzet, eigen adressen
  guest-b-isolation:
    - rule: {dl_type: 0x0806, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 133, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 134, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 135, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 136, actions: {allow: true}}
    - rule: {dl_type: 0x0800, nw_dst: "10.21.0.1", actions: {allow: true}}
    - rule: {dl_type: 0x86dd, ipv6_dst: "2001:db8:b:20::1", actions: {allow: true}}
    - rule: {dl_type: 0x0800, nw_dst: "10.21.0.0/24", actions: {allow: false}}
    - rule: {dl_type: 0x86dd, ipv6_dst: "2001:db8:b:20::/64", actions: {allow: false}}
    - rule:
        actions:
          allow: true
          meter: guest-ratelimit

vlans:
  # === Gebouw A - ISP A: 2001:db8:a::/48 ===
  employee_a:
    vid: 11
    description: "Employee gebouw A"
    faucet_vips: ["10.10.0.1/24", "2001:db8:a:10::1/64"]
    faucet_mac: "0e:00:00:00:11:01"
  guest_a:
    vid: 21
    description: "Gasten gebouw A - onderling geisoleerd, 10 Mbit"
    acls_in: [guest-a-isolation]
    faucet_vips: ["10.20.0.1/24", "2001:db8:a:20::1/64"]
    faucet_mac: "0e:00:00:00:21:01"
  management_a:
    vid: 31
    description: "Management gebouw A"
    faucet_vips: ["10.30.0.1/26", "2001:db8:a:30::1/64"]
    faucet_mac: "0e:00:00:00:31:01"
  wan_a:
    vid: 41
    description: "Transit gebouw A naar ISP A"
    faucet_vips: ["10.99.0.1/24", "2001:db8:a:99::1/64"]
    faucet_mac: "0e:00:00:00:41:01"
    routes:
      - route: {ip_dst: "0.0.0.0/0", ip_gw: "10.99.0.10"}
      - route: {ip_dst: "::/0", ip_gw: "2001:db8:a:99::10"}
      - route: {ip_dst: "2001:db8:a:ff::/64", ip_gw: "2001:db8:a:99::10"}

  # === Gebouw B - ISP B: 2001:db8:b::/48 ===
  employee_b:
    vid: 12
    description: "Employee gebouw B"
    faucet_vips: ["10.11.0.1/24", "2001:db8:b:10::1/64"]
    faucet_mac: "0e:00:00:00:12:01"
  guest_b:
    vid: 22
    description: "Gasten gebouw B - onderling geisoleerd, 10 Mbit"
    acls_in: [guest-b-isolation]
    faucet_vips: ["10.21.0.1/24", "2001:db8:b:20::1/64"]
    faucet_mac: "0e:00:00:00:22:01"
  management_b:
    vid: 32
    description: "Management gebouw B"
    faucet_vips: ["10.31.0.1/26", "2001:db8:b:30::1/64"]
    faucet_mac: "0e:00:00:00:32:01"
  wan_b:
    vid: 42
    description: "Transit gebouw B naar ISP B"
    faucet_vips: ["10.98.0.1/24", "2001:db8:b:99::1/64"]
    faucet_mac: "0e:00:00:00:42:01"
    routes:
      - route: {ip_dst: "0.0.0.0/0", ip_gw: "10.98.0.10"}
      - route: {ip_dst: "::/0", ip_gw: "2001:db8:b:99::10"}
      - route: {ip_dst: "2001:db8:b:ff::/64", ip_gw: "2001:db8:b:99::10"}

routers:
  # Elke router is een expliciete toestemming: deze twee VLAN's mogen
  # elkaars verkeer routeren. Wat hier niet staat, heeft geen pad -
  # de scheiding zit dus in de routeringslaag, niet in filtering.
  #
  # Guest komt alleen voor in een router met de eigen wan: gasten
  # bereiken de ISP en verder niets.

  # Gebouw A: elke categorie naar de eigen uplink
  router-a-employee:   {vlans: [employee_a, wan_a]}
  router-a-guest:      {vlans: [guest_a, wan_a]}
  router-a-management: {vlans: [management_a, wan_a]}

  # Gebouw B: idem
  router-b-employee:   {vlans: [employee_b, wan_b]}
  router-b-guest:      {vlans: [guest_b, wan_b]}
  router-b-management: {vlans: [management_b, wan_b]}

  # Tussen de gebouwen: alleen dezelfde categorie, via de darkfiber
  router-employee-cross:   {vlans: [employee_a, employee_b]}
  router-management-cross: {vlans: [management_a, management_b]}

dps:
  # === Gebouw A ===
  sA_core:
    dp_id: 0x1
    hardware: "Open vSwitch"
    stack:
      priority: 1          # root van de stack
    interfaces:
      1: {description: "stack naar sA1",     stack: {dp: sA1, port: 1}}
      2: {description: "stack naar sA2",     stack: {dp: sA2, port: 1}}
      3: {description: "darkfiber naar sB_core", stack: {dp: sB_core, port: 4}}
      4:
        description: "ispA - uplink gebouw A"
        native_vlan: wan_a

  sA1:
    dp_id: 0x2
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sA_core", stack: {dp: sA_core, port: 1}}
      2: {description: "hA1_emp", native_vlan: employee_a}
      3:
        description: "hA1_gst"
        native_vlan: guest_a
        unicast_flood: false     # gasten krijgen geen onbekend unicast te zien
      4:
        description: "hA1_mgt"
        native_vlan: management_a
        permanent_learn: true    # NFV: port security - bindt poort aan eerste MAC
        max_hosts: 1

  sA2:
    dp_id: 0x3
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sA_core", stack: {dp: sA_core, port: 2}}
      2: {description: "hA2_emp", native_vlan: employee_a}
      3:
        description: "hA2_gst"
        native_vlan: guest_a
        unicast_flood: false
      4:
        description: "hA2_mgt"
        native_vlan: management_a
        permanent_learn: true
        max_hosts: 1

  # === Gebouw B ===
  sB_core:
    dp_id: 0x4
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB1",     stack: {dp: sB1, port: 1}}
      2: {description: "stack naar sB2",     stack: {dp: sB2, port: 1}}
      3: {description: "stack naar sB3",     stack: {dp: sB3, port: 1}}
      4: {description: "darkfiber naar sA_core", stack: {dp: sA_core, port: 3}}
      5:
        description: "ispB - uplink gebouw B"
        native_vlan: wan_b

  sB1:
    dp_id: 0x5
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB_core", stack: {dp: sB_core, port: 1}}
      2: {description: "hB1_emp", native_vlan: employee_b}
      3:
        description: "hB1_gst"
        native_vlan: guest_b
        unicast_flood: false
      4:
        description: "hB1_mgt"
        native_vlan: management_b
        permanent_learn: true
        max_hosts: 1

  sB2:
    dp_id: 0x6
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB_core", stack: {dp: sB_core, port: 2}}
      2: {description: "hB2_emp", native_vlan: employee_b}
      3:
        description: "hB2_gst"
        native_vlan: guest_b
        unicast_flood: false
      4:
        description: "hB2_mgt"
        native_vlan: management_b
        permanent_learn: true
        max_hosts: 1

  sB3:
    dp_id: 0x7
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB_core", stack: {dp: sB_core, port: 3}}
      2: {description: "hB3_emp", native_vlan: employee_b}
      3:
        description: "hB3_gst"
        native_vlan: guest_b
        unicast_flood: false
      4:
        description: "hB3_mgt"
        native_vlan: management_b
        permanent_learn: true
        max_hosts: 1
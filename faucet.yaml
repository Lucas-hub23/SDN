meters:
  guest-ratelimit:
    meter_id: 1
    entry:
      flags: ["KBPS", "BURST", "STATS"]
      bands:
        - type: DROP
          rate: 10000        # 10 Mbit/s
          burst_size: 1000   # 1000 kb burst

acls:
  # ---------------------------------------------------------------
  # Gastnetwerk: onderling geisoleerd (v4 EN v6), rest via de meter.
  # Scheiding met employee/management komt van de routers, niet hier.
  # ---------------------------------------------------------------
  guest-isolation:
    # ARP ongelimiteerd - anders breekt IPv4 adresresolutie
    - rule: {dl_type: 0x0806, actions: {allow: true}}

    # ICMPv6 Neighbor Discovery: de IPv6-tegenhanger van ARP.
    # ZONDER deze regels werkt IPv6 helemaal niet.
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 133, actions: {allow: true}}  # RS
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 134, actions: {allow: true}}  # RA
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 135, actions: {allow: true}}  # NS
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 136, actions: {allow: true}}  # NA

    # Eigen gateway bereikbaar, ongelimiteerd (v4 + v6)
    - rule: {dl_type: 0x0800, nw_dst: "10.20.0.1", actions: {allow: true}}
    - rule: {dl_type: 0x86dd, ipv6_dst: "2001:db8:20::1", actions: {allow: true}}

    # Gast-naar-gast geblokkeerd, in beide protocollen
    - rule: {dl_type: 0x0800, nw_dst: "10.20.0.0/24", actions: {allow: false}}
    - rule: {dl_type: 0x86dd, ipv6_dst: "2001:db8:20::/64", actions: {allow: false}}

    # Al het overige verkeer (internet) door de meter
    - rule:
        actions:
          allow: true
          meter: guest-ratelimit

  # ---------------------------------------------------------------
  # DIAGNOSE: doet conntrack het op deze datapath?
  # Stuurt ongevolgde pakketten naar de conntrack-module en laat
  # daarna alles door. Verandert dus niets aan de connectiviteit -
  # het enige doel is te zien of er ct-flows en conntrack-entries
  # ontstaan. De echte firewallregels bouwen we hierop verder.
  # ---------------------------------------------------------------
  ct-diagnose:
    - rule: {dl_type: 0x0806, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 133, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 134, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 135, actions: {allow: true}}
    - rule: {dl_type: 0x86dd, nw_proto: 58, icmpv6_type: 136, actions: {allow: true}}
    # Ongevolgd IPv4 -> conntrack-module, daarna terug in tabel 0
    - rule:
        dl_type: 0x0800
        ct_state: 0/0x20          # -trk (untracked)
        actions:
          ct: {zone: 10, table: 0}
    # Ongevolgd IPv6 -> zelfde behandeling
    - rule:
        dl_type: 0x86dd
        ct_state: 0/0x20
        actions:
          ct: {zone: 10, table: 0}
    - rule: {actions: {allow: true}}

vlans:
  employee:
    vid: 10
    description: "Employee netwerk"
    faucet_vips: ["10.10.0.1/23", "2001:db8:10::1/64"]
    faucet_mac: "0e:00:00:00:10:01"
  guest:
    vid: 20
    description: "Gastennetwerk - onderling geisoleerd"
    acls_in: [guest-isolation]
    faucet_vips: ["10.20.0.1/24", "2001:db8:20::1/64"]
    faucet_mac: "0e:00:00:00:20:01"
  management:
    vid: 30
    description: "Management netwerk"
    faucet_vips: ["10.30.0.1/26", "2001:db8:30::1/64"]
    faucet_mac: "0e:00:00:00:30:01"
  wan:
    vid: 40
    description: "Transit-VLAN naar NAT-node (v4) en ISP-node (v6)"
    faucet_vips: ["10.99.0.1/24", "2001:db8:99::1/64"]
    faucet_mac: "0e:00:00:00:40:01"
    routes:
      # IPv4 default: via de NAT-node, die MASQUERADE't naar echt internet
      - route:
          ip_dst: "0.0.0.0/0"
          ip_gw: "10.99.0.10"
      # IPv6 default: via de ISP-node. Geen NAT - IPv6 is end-to-end.
      - route:
          ip_dst: "::/0"
          ip_gw: "2001:db8:99::20"

routers:
  # Elk user-VLAN mag alleen met wan routeren, niet met elkaar.
  # De scheiding zit dus in de routeringslaag: er bestaat geen pad
  # van employee naar management, dus valt er niets te filteren.
  router-employee-wan:
    vlans: [employee, wan]
  router-guest-wan:
    vlans: [guest, wan]
  router-management-wan:
    vlans: [management, wan]

dps:
  # === Gebouw A ===
  sA_core:
    dp_id: 0x1
    hardware: "Open vSwitch"
    stack:
      priority: 1          # root van de stack
    interfaces:
      1: {description: "stack naar sA1",     stack: {dp: sA1, port: 1}}
      2: {description: "stack naar sA2",     stack: {dp: sA2, port: 1}}
      3: {description: "darkfiber naar sB_core", stack: {dp: sB_core, port: 4}}
      4:
        description: "natNode - IPv4 transit naar ISP"
        native_vlan: wan
      5:
        description: "ispNode - IPv6 transit naar ISP"
        native_vlan: wan
        acls_in: [ct-diagnose]

  sA1:
    dp_id: 0x2
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sA_core", stack: {dp: sA_core, port: 1}}
      2: {description: "hA1_emp", native_vlan: employee}
      3: {description: "hA1_gst", native_vlan: guest}
      4:
        description: "hA1_mgt"
        native_vlan: management
        permanent_learn: true    # NFV: port security - bindt poort aan eerste MAC
        max_hosts: 1

  sA2:
    dp_id: 0x3
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sA_core", stack: {dp: sA_core, port: 2}}
      2: {description: "hA2_emp", native_vlan: employee}
      3: {description: "hA2_gst", native_vlan: guest}
      4:
        description: "hA2_mgt"
        native_vlan: management
        permanent_learn: true
        max_hosts: 1

  # === Gebouw B ===
  sB_core:
    dp_id: 0x4
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB1",     stack: {dp: sB1, port: 1}}
      2: {description: "stack naar sB2",     stack: {dp: sB2, port: 1}}
      3: {description: "stack naar sB3",     stack: {dp: sB3, port: 1}}
      4: {description: "darkfiber naar sA_core", stack: {dp: sA_core, port: 3}}

  sB1:
    dp_id: 0x5
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB_core", stack: {dp: sB_core, port: 1}}
      2: {description: "hB1_emp", native_vlan: employee}
      3: {description: "hB1_gst", native_vlan: guest}
      4:
        description: "hB1_mgt"
        native_vlan: management
        permanent_learn: true
        max_hosts: 1

  sB2:
    dp_id: 0x6
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB_core", stack: {dp: sB_core, port: 2}}
      2: {description: "hB2_emp", native_vlan: employee}
      3: {description: "hB2_gst", native_vlan: guest}
      4:
        description: "hB2_mgt"
        native_vlan: management
        permanent_learn: true
        max_hosts: 1

  sB3:
    dp_id: 0x7
    hardware: "Open vSwitch"
    interfaces:
      1: {description: "stack naar sB_core", stack: {dp: sB_core, port: 3}}
      2: {description: "hB3_emp", native_vlan: employee}
      3: {description: "hB3_gst", native_vlan: guest}
      4:
        description: "hB3_mgt"
        native_vlan: management
        permanent_learn: true
        max_hosts: 1